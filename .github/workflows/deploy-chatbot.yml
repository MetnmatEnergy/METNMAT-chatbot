name: Deploy chatbot (v2 host)

# Build the widget bundles, assemble a self-contained Bun release, upload it with
# a sha256 sidecar, and release over SSM as root via `metnmat-release chat` on the
# isolated v2 host (see METNMAT-WEBSITE/deploy/v2). Replaces deploy-chatbot-ec2.yml
# after the 2026-09 incident. OIDC only — no static AWS keys in this repository.
#
# Runtime secrets are NOT shipped: the host's root-only fetcher reads
# metnmat/chat/env and hands it to the metnmat-chat.service unit.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/deploy-gcp.ps1", "deploy/deploy.config.ps1", "render.yaml", "Dockerfile"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (blank = HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-chat
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  APP: chat
  ARTIFACT_NAME: chatbot-build.tgz
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || 'metnmat-deploy-artifacts-976134557584' }}
  PROD_INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Guard configuration
        run: |
          [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::AWS_DEPLOY_ROLE_ARN secret not set (OIDC only)"; exit 1; }
          [ -n "${{ env.PROD_INSTANCE_ID }}" ]         || { echo "::error::PROD_INSTANCE_ID repository variable not set"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build the widget bundles
        run: bun run build:widget
      - name: Assemble release
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/chat-release"; rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r index.ts src package.json tsconfig.json bun.lock "$OUT/"
          [ -d public ] && cp -r public "$OUT/public"
          [ -d iframe-chat-widget ] && cp -r iframe-chat-widget "$OUT/iframe-chat-widget"
          ( cd "$OUT" && bun install --production --frozen-lockfile || bun install --production )
          echo "${{ steps.resolve.outputs.sha }}" > "$OUT/RELEASE_ID"
          [ -f "$OUT/index.ts" ] || { echo "::error::index.ts missing"; exit 1; }
          tar -czf "$ARTIFACT_NAME" -C "$OUT" .
          sha256sum "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          echo "artifact: $(du -h "$ARTIFACT_NAME" | cut -f1)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-chat-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload artifact + checksum
        run: |
          set -euo pipefail
          DEST="s3://${ARTIFACT_BUCKET}/${APP}/${{ steps.resolve.outputs.sha }}"
          aws s3 cp "$ARTIFACT_NAME"        "$DEST/$ARTIFACT_NAME"        --only-show-errors
          aws s3 cp "$ARTIFACT_NAME.sha256" "$DEST/$ARTIFACT_NAME.sha256" --only-show-errors

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-chat-release-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Release over SSM (root, metnmat-release)
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          I="$PROD_INSTANCE_ID"
          CMD=$(aws ssm send-command --instance-ids "$I" --document-name AWS-RunShellScript \
            --comment "release ${APP} ${SHA}" --timeout-seconds 900 \
            --parameters commands="[\"export ARTIFACT_BUCKET='${ARTIFACT_BUCKET}' HEALTH_TIMEOUT=150\",\"/usr/local/sbin/metnmat-release ${APP} ${SHA}\"]" \
            --query 'Command.CommandId' --output text)
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$I" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$I" --query StandardOutputContent --output text || true
          echo "--- stderr ---"; aws ssm get-command-invocation --command-id "$CMD" --instance-id "$I" --query StandardErrorContent --output text || true
          [ "$STATUS" = "Success" ] || { echo "::error::release failed ($STATUS)"; exit 1; }
